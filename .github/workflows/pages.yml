# Tests and builds One More Room on every push and pull request, and
# publishes the site to GitHub Pages from main.
#
# The published site is the root page (index.html) plus the built game in
# one-more-room/. Nothing is loaded from any other repository.
name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: one-more-room/package-lock.json

      - name: Install
        run: npm ci --prefix one-more-room

      - name: Rules and service tests
        run: npm test --prefix one-more-room

      - name: Typecheck and build
        run: npm run build --prefix one-more-room

      - name: Assemble the site
        run: |
          mkdir -p _site/one-more-room
          cp index.html _site/
          cp -r one-more-room/dist/. _site/one-more-room/
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - id: deployment
        uses: actions/deploy-pages@v4
